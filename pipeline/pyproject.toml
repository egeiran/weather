[project]
name = "weather-layers"
version = "0.1.0"
description = "Fetch open forecast data (MET Norway, ECMWF), regrid to Web Mercator and write value-encoded tiles, point series and a manifest."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pyproj>=3.7",
    "pillow>=11.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
ecmwf = [
    "eccodes>=2.39",
]

[project.scripts]
weather-layers = "weather_layers.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "jsonschema>=4.23",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits real MET/ECMWF servers (deselected by default; run with -m live)",
]
